<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
</head>
<body>
    <h1>Products</h1>
    <h2>View products</h2>
    <table>
        <tr>
            <th>PRODUCT NAME</th>
            <th>PRODUCT PRICE</th>
        </tr>
        <tr th:each="product3 : ${products}">
            <td th:text="${product3.name}"></td>
            <td th:text="${product3.price}"></td>
        </tr>
    </table>
    <h2>Add a product</h2>
    <form action="/products3" method="post">
        Name: <input type="text" name="name"><br />
        Price: <input type="number" step="any" name="price"><br />
        <button type="submit">Add product</button>
    </form>
</body>
</html>
